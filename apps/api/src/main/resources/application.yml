spring:
  application:
    name: voting-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:  
      uri: ${MONGODB_URI:mongodb://localhost:27017/voting_db}  # 默认值

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWTSECRET}         # 没有默认值，需要提供
    expire-ms: 3600000           # 有默认值
  cors:
    allowed-origins:
      - http://localhost:3000    # 基础配置
    allowed-methods:
      - GET
      - POST

logging:
  level:
    root: INFO                   # 基础日志级别