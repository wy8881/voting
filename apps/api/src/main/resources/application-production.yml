spring:
  data:
    mongodb:
      uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_CLUSTER}/${MONGO_DATABASE}

server:
  port: ${PORT:8080}

app:
  encryption:
    key: ${ENCRYPTION_KEY}
    init-vector: ${ENCRYPTION_INIT_VECTOR}
  jwt:
    secret: ${JWTSECRET}
    expire-ms: ${JWT_EXPIRE_MS}
  db:
    reset:
      enabled: ${DB_RESET_ENABLED:true}
  cors:
    allowed-origins:
      - https://voting.wyprojects.com
      - https://wyprojects.com
    allowed-methods:              
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:              
      - "*"
    allow-credentials: true       
    max-age: 3600                 

logging:
  level:
    root: INFO
    com.example.voting: INFO